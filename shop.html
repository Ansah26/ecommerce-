<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIBI.COM</title>
    <link rel="stylesheet" href="css files/shop.css">
</head>
<body>
    <div class="container">
        <div class="logo">TOBIBI.COM</div>
        <div class="navigator">
            <a href="index.html"><div class="intro">HOME</div></a>
            <a href="about.html"><div class="about">ABOUT</div></a>
            <a href="shop.html"><div class="shop">SHOP</div></a>
        </div>
        <div class="cart"><img src="Project Files\Images\cart.svg" alt="cart showing purchase" width="40%" height="10%" class="IMG"><span id="cartCount">0</span></div>
    </div>
    <div class="our">
        <p class="ou">
            WELCOME TO OUR STORE🙋‍♂️
        </p>
    </div>

    <div class="gridCont1">
        <div class="gw1">
            <div class="price">$6000.00</div>
            <div class="pro1"></div>
            <h2 class="mc1">MACBOOK AIR</h2>
            <button  class="add">ADD TO CHART</button>
            
        </div>
        
        <div class="gw2">
            <div class="price">$700.00</div>
            <div class="pro2"></div>
            <h2 class="mc2">APPLE WATCH</h2>
            <button class="add">ADD TO CHART</button>
        </div>
        <div class="gw3">
            <div class="price">$2750.00</div>
            <div class="pro3"></div>
            <h2 class="mc3">SAMSUNG TV</h2>
            <button class="add">ADD TO CHART</button>
            
        </div>
    </div>

    <div class="gridCont2">
        <div class="gw4">
            <div class="price">$1500.00</div>
            <div class="pro4"></div>
            <h2 class="mc3">PIXEL 4a</h2>
            <button class="add">ADD TO CHART</button>
        </div>
        <div class="gw5">
            <div class="price">$5550.00</div>
            <div class="pro5"></div>
            <h2 class="mc5">PS5 CONSOLE</h2>
            <button class="add">ADD TO CHART</button>
        </div>
        <div class="gw6">
            <div class="price">$120.00</div>
            <div class="pro6"></div>
            <h2 class="mc6">AIR PODS</h2>
            <button class="add">ADD TO CHART</button>
        </div>
    </div>
    <div id="paymentModel" class="model">
        <div class="payment-box">
            <span id="closeModal" class="close">&times;</span>
            <h2 class="rtr">Complete Your Order</h2>
            <p>enter your details to continue</p>

            <form id="paymentForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your Full Name" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your Email " required>

                <label for="PhoneNumber">Phone Number</label>
                <input type="tel" id="PhoneNumber" placeholder="XXX-XXX-XXXX" required>

                <label for="amount">Amount</label>
                <input type="number" id="amount" value="number" required>

                <button type="submit" id="paymentForm">Continue to Payment</button>

            </form>
        </div>
    </div>
    
    


    <div class="d">
        <div class="b1"></div>
        <div class="b2"></div>
        <div class="b3"></div>
    </div>

<script src="https://js.paystack.co/v2/inline.js"></script>
<script src="js files/shop.js"></script>
</body>
</html>
